<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img"><title>Mis Finanzas · Claridad sin conexión. Proyecto propio. App Android.</title><g font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="298" rx="13" fill="#fff" stroke="#dce3f0"/><rect x="24" y="22" width="113" height="23" rx="5" fill="#edf2fb"/><text x="34" y="38" font-size="9" fill="#3157cf" font-weight="700" letter-spacing=".5">PROYECTO PROPIO</text><text x="572" y="39" font-size="10" fill="#57657c" text-anchor="end">App Android</text><text x="27" y="85" font-size="23" fill="#15213b" font-weight="700" letter-spacing="-.4">Mis Finanzas · Claridad sin conexión</text><text x="27" y="119" font-size="13" fill="#57657c" >Una app Android para entender gastos, presupuestos y ahorros en</text><text x="27" y="140" font-size="13" fill="#57657c" >quetzales, con datos locales y una interfaz pensada para el día a</text><text x="27" y="161" font-size="13" fill="#57657c" >día.</text><path fill="none" d="M27 232h546" stroke="#dce3f0"/><text x="27" y="258" font-size="11" fill="#3157cf" >Kotlin / Android / SQLite</text><text x="27" y="281" font-size="11" fill="#57657c" >Ver el caso en mi portafolio</text><text x="569" y="280" font-size="24" fill="#7650c8" text-anchor="end">↗</text></g></svg>