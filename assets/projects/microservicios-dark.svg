<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img"><title>Plataforma de microservicios. Colaboración. Implementación.</title><g font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="298" rx="13" fill="#111a2b" stroke="#2a3854"/><rect x="24" y="22" width="102" height="23" rx="5" fill="#162138"/><text x="34" y="38" font-size="9" fill="#a6baff" font-weight="700" letter-spacing=".5">COLABORACIÓN</text><text x="572" y="39" font-size="10" fill="#adb9cf" text-anchor="end">Implementación</text><text x="27" y="85" font-size="23" fill="#edf2ff" font-weight="700" letter-spacing="-.4">Plataforma de microservicios</text><text x="27" y="119" font-size="13" fill="#adb9cf" >Una plataforma para conectar producción, calidad, inventario y</text><text x="27" y="140" font-size="13" fill="#adb9cf" >ventas sin concentrar toda la lógica en un único servicio.</text><path fill="none" d="M27 232h546" stroke="#2a3854"/><text x="27" y="258" font-size="11" fill="#a6baff" >TypeScript / NestJS / NATS / Docker</text><text x="27" y="281" font-size="11" fill="#adb9cf" >Ver el caso en mi portafolio</text><text x="569" y="280" font-size="24" fill="#c2adff" text-anchor="end">↗</text></g></svg>